<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box This Lap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🏁 Box This Lap</h1>
    <p>Digite um ano e veja o campeão e o calendário daquela temporada</p>
  </header>

  <main>
    <div class="busca">
      <input type="number" id="inputAno" placeholder="Digite o ano da corrida..." min="1950" max="2026">
      <button id="btnBuscar">Buscar</button>
    </div>

    <div id="resultado" class="resultado">
      <p class="dica">Digite um ano (a partir de 1950) e clique em Buscar.</p>
    </div>
  </main>

  <footer>
    <p>Box This Lap · Dados fornecidos pela <a href="https://github.com/jolpica/jolpica-f1" target="_blank">Jolpica-F1 API</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
